<!DOCTYPE html>
<html>
<head>
    <title>Registration Successful</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <h1>Registration Successful!</h1>

    <h2>Welcome {{ student.name }} {{ student.lastname }}</h2>

    <p>Your Student ID: {{ student.id }}</p>

    <p>Your registration details have been saved.</p>

    <a href="{{ url_for('certificate', student_id=student.id) }}">
        <button>Download Certificate</button>
    </a>

</div>

</body>
</html>
